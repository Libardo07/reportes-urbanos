spring.application.name=reportes-api

# Configuración de MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=reportes_urbanos
spring.data.mongodb.option.connections-per-host=10
spring.data.mongodb.option.min-connections-per-host=2
spring.data.mongodb.option.connect-timeout=5000
spring.data.mongodb.option.socket-timeout=5000
spring.data.mongodb.option.max-wait-time=5000

# Configuración de seguridad y OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Configuración del admin
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.nombre=${ADMIN_NOMBRE}

# Configuración de envio correo electrónico
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USER_NAME}
spring.mail.password=${MAIL_PASSWORD_}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Configuración de Redis para caching
spring.data.redis.url=${REDIS_URL}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Configuración de compresión de respuestas
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

app.base-url=${APP_BASE_URL}


# Configuración de AWS S3 para almacenamiento de imágenes
aws.access-key=${AWS_ACCESS_KEY}  
aws.secret-key= ${AWS_SECRET_KEY}
aws.s3.bucket=reportes-urbanos-imagenes
aws.s3.region=us-east-2

# Configuración de límites de carga de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Configuración de MySQL
spring.datasource.url= ${DATASOURCE_URL}
spring.datasource.username= ${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:9093}








