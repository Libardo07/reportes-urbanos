<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamentamos que persista</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<main class="auth escena escena-no">
    <section class="resultado vidrio">

        <div class="resultado-icono">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        </div>

        <h1>Lamentamos que persista</h1>
        <span class="estado estado--pendiente">Problema persiste</span>
        <p>Entendemos tu frustración. Inicia sesión y deja un comentario
            en tu reporte explicando qué sigue fallando. El equipo lo revisará.</p>

        <a th:href="@{/login}" class="btn-principal">Comentar mi reporte</a>

        <span class="resultado-pie">Reportes Urbanos · Cartagena de Indias</span>
    </section>
</main>

<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
