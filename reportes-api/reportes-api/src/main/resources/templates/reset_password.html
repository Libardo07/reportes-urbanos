<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña — Reportes Urbanos</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="preload" as="image" th:href="@{/images/hero.webp}" type="image/webp" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div id="loader" class="loader-overlay" aria-hidden="true">
    <div class="loader"></div>
</div>

<main class="auth escena escena-reset">
    <div class="auth-wrap">

        <section class="auth-info vidrio">
            <a th:href="@{/}" class="auth-logo">
                <img th:src="@{/images/logo.svg}" alt="" width="40" height="40">
                Reportes Urbanos
            </a>
            <p class="auth-lema">Crea una contraseña nueva</p>
            <div>
                <p>Crea una contraseña segura de al menos 6 caracteres para proteger tu cuenta.</p>
                <a th:href="@{/login}" class="btn-outline">Volver al login</a>
            </div>
        </section>

        <section class="auth-form vidrio">
            <h1>Restablecer contraseña</h1>
            <p class="subtitulo">Ingresa y confirma tu nueva contraseña</p>

            <div th:if="${error}" class="login-notice login-notice--error" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/recuperar-password/reset}" method="post" id="resetForm" data-carga>
                <input type="hidden" name="token" th:value="${token}">

                <div class="campo">
                    <label for="nuevaPassword">Nueva contraseña</label>
                    <div class="entrada">
                        <svg class="ico-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="nuevaPassword" name="nuevaPassword"
                            placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                        <button type="button" class="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <div class="entrada">
                        <svg class="ico-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="confirmarPassword" name="confirmarPassword"
                            placeholder="Repite la contraseña" required autocomplete="new-password">
                        <button type="button" class="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-principal">Restablecer contraseña</button>
            </form>

            <p class="nota">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Usa al menos <strong>6 caracteres</strong>. Combina letras,
                    números y símbolos para mayor seguridad.</span>
            </p>
        </section>

    </div>
</main>

<script th:src="@{/js/auth.js}" defer></script>
<script th:src="@{/js/reset_password.js}" defer></script>
</body>
</html>
