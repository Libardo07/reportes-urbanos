<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña restablecida — Reportes Urbanos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<main class="auth escena escena-exito">
    <section class="resultado vidrio">

        <div class="resultado-icono">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>

        <h1>¡Contraseña restablecida!</h1>
        <p>Tu contraseña ha sido actualizada correctamente.
            Redirigiendo al inicio de sesión en
            <strong><span id="countdown">3</span>s</strong>...</p>

        <a th:href="@{/login}" id="btn-login" class="btn-principal">Ir al inicio de sesión</a>

        <span class="resultado-pie">Reportes Urbanos · Cartagena de Indias</span>
    </section>
</main>

<script th:src="@{/js/auth.js}" defer></script>
<script th:src="@{/js/reset_exitoso.js}" defer></script>
</body>
</html>
