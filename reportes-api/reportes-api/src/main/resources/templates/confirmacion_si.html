<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu confirmación!</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<main class="auth escena escena-si">
    <section class="resultado vidrio">

        <div class="resultado-icono resultado-icono--ok">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>

        <h1>¡Gracias por confirmarlo!</h1>
        <span class="estado estado--ok">Problema resuelto</span>
        <p>Nos alegra saber que el problema fue solucionado satisfactoriamente.
            Tu confirmación nos ayuda a mejorar la gestión urbana de Cartagena.</p>

        <a th:href="@{/login}" class="btn-principal">Ir a la plataforma</a>

        <span class="resultado-pie">Reportes Urbanos · Cartagena de Indias</span>
    </section>
</main>

<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
