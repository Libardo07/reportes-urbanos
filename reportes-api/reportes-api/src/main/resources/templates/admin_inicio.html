<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Administrador - Reportes Urbanos</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/panel.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/panel-nuevo.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>
<body class="dashboard-container admin">

    <div id="loader" class="loader-overlay" aria-hidden="true">
        <div class="loader"></div>
    </div>

    <header class="topnav">
        <button type="button" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <div class="marca">
            <img th:src="@{/images/logo.svg}" alt="" width="38" height="38">
            Reportes Urbanos
        </div>

        <nav class="topnav-menu" id="menu-principal" aria-label="Menú principal">
            <button type="button" class="menu-item active" data-view="/admin/fragmento/inicio">Inicio</button>
            <button type="button" class="menu-item" data-view="/admin/dashboard">Dashboard</button>
            <button type="button" class="menu-item" data-view="/admin/fragmento/lista-reportes">Reportes</button>
            <button type="button" class="menu-item" data-view="/reportes/fragmento/explorar">Explorar</button>
            <button type="button" class="menu-item" th:if="${usuario.email == 'adminMain@gmail.com'}" data-view="/admin/fragmento/formulario-admin">Nuevo admin</button>
        </nav>

        <div class="topnav-usuario">
            <div class="usuario-info">
                <div class="usuario-inicial"></div>
                <div class="details">
                    <div class="nombre" th:text="${usuario.nombre}"></div>
                    <div class="rol" th:text="${usuario.rol}"></div>
                </div>
            </div>
            <button type="button" class="btn-salir" onclick="logout()">Salir</button>
        </div>
    </header>

    <main class="content" id="content-area"></main>
    <div class="filtro-overlay" id="filtroOverlay" onclick="toggleFiltroPanel()"></div>

    <script th:src="@{/js/script.js}"></script>
    <script th:src="@{/js/panel-shell.js}" defer></script>
    <script th:src="@{/js/reporte_detalle.js}" defer></script>
</body>
</html>
