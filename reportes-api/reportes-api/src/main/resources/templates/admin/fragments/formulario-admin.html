<div class="card" th:fragment="formulario-admin">
    <div class="content-header">
        <h1>Crear nuevo administrador</h1>
    </div>

    <form th:action="@{/admin/registrar-admin}" th:object="${nuevoAdmin}" method="post" data-ajax="true" data-form-type="create-admin">

        <div class="form-cols">

            <div class="form-col">
                <h2 class="form-bloque-titulo"><span>01</span>Datos</h2>

                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" minlength="4" placeholder="Nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" minlength="14" placeholder="nombre@correo.com" required>
                </div>
            </div>

            <div class="form-col">
                <h2 class="form-bloque-titulo"><span>02</span>Acceso</h2>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" th:field="*{password}" class="form-control" minlength="6" placeholder="Mínimo 6 caracteres" required>
                        <button type="button" class="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <p class="nota-form">El nuevo administrador podrá gestionar todos los reportes y cambiar sus estados.</p>
                </div>
            </div>

        </div>

        <div class="form-acciones">
            <button type="submit" class="btn-enviar-animated">
                <span class="flecha">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
                </span>
                Registrar administrador
            </button>
        </div>
    </form>
</div>
